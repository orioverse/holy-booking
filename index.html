function areaName(a){ const id={wadi:"wadi-el-natroun"}[a]; if(id) return stopById(id).shortTitle; const m=DATA.mapLabels.find(x=>x.id===a); return m?(m.name[lang]||m.name.en):a; }
function localPlan(st){
  const A=PD.areas, per=PD.sitesPerDay[st.pace];
  const order=DATA.stops.map(s=>s.id).filter(id=>st.stops.has(id));
  let chunks=[]; ["wadi","cairo","minya","assiut"].forEach(a=>{ const g=order.filter(id=>A[id]===a); for(let i=0;i<g.length;i+=per) chunks.push(g.slice(i,i+per)); });
  const need=chunks.length; let compressed=null;
  while(chunks.length>st.days && chunks.length>1){
    compressed=need; let best=0,bs=1e9;
    for(let i=0;i<chunks.length-1;i++){ const same=A[chunks[i][0]]===A[chunks[i+1][0]]; const sz=chunks[i].length+chunks[i+1].length+(same?0:3); if(sz<bs){bs=sz;best=i;} }
    chunks.splice(best,2,chunks[best].concat(chunks[best+1]));
  }
  const days=chunks.map(c=>({sites:c}));
  let extra=st.days-days.length;
  while(extra-->0){ const i=days.findIndex(d=>d.sites.length&&["minya","assiut"].includes(A[d.sites[0]])); days.splice(i<0?days.length:i,0,{sites:[]}); }
  const S=localizedStops(), mode=t("ui.planner.travelOptions."+st.travel), stayL=t("ui.planner.stayOptions."+st.stay);
  const act=(k,site)=>t("ui.planner.interestActivities."+k,{site});
  const has=k=>st.interests.has(k);
  let where="cairo";
  const out=days.map((d,i)=>{
    const ss=d.sites.map(id=>S.find(s=>s.id===id));
    if(!ss.length) return {day:i+1,title:t("ui.planner.freeDay"),stopIds:[],morning:t("ui.planner.freeDay"),afternoon:t("ui.planner.rest"),evening:has("food")?act("food"):t("ui.planner.rest"),travel:"",overnight:t("ui.planner.stayLine",{stay:stayL,area:areaName(where)})};
    const area=A[ss[0].id], sleep=area==="wadi"?"cairo":area;
    let travel="";
    if(area==="wadi") travel=t("ui.planner.dayTrip");
    else if(area!==where) travel=t("ui.planner.travelLine",{mode,from:areaName(where),to:areaName(area)});
    where=sleep;
    const visit=s=>t("ui.planner.visit",{site:s.shortTitle,highlight:s.highlights[0]});
    const extraAct=["prayer","history","photo"].find(has);
    return {day:i+1,title:ss.map(s=>s.shortTitle).join(sep()),stopIds:ss.map(s=>s.id),
      morning:(i===0?t("ui.planner.arrive")+". ":"")+visit(ss[0]),
      afternoon:ss[1]?visit(ss[1]):(extraAct?act(extraAct,ss[0].shortTitle):t("ui.planner.rest")),
      evening:ss[2]?visit(ss[2]):(has("nile")?act("nile"):has("food")?act("food"):t("ui.planner.rest")),
      travel,overnight:t("ui.planner.stayLine",{stay:stayL,area:areaName(sleep)})};
  });
  const tips=[]; if(has("family")) tips.push(act("family")); if(compressed) tips.push(t("ui.planner.compressed",{n:compressed}));
  return {title:t("ui.planner.resultTitle",{duration:fmt(st.days,loc().intl,"day")}),summary:"",days:out,tips};
}
function aiPrompt(st){
  const sites=DATA.stops.filter(s=>st.stops.has(s.id)).map(s=>({id:s.id,name:s.i18n.en.title,area:PD.areas[s.id],
    highlights:s.i18n.en.highlights.map(h=>interpolate(h,s.facts,"en")),
    access:s.access.map(a=>a.mode+(a.status==="planned"?" (PLANNED, not operating yet)":""))}));
  const language=langName(lang,"en");
  return `You are planning a Christian pilgrimage itinerary in Egypt along the Holy Family trail.
Write every text field in ${language}.

Sites the traveller chose (use only these; stopIds must be copied exactly):
${JSON.stringify(sites)}

Traveller choices: ${JSON.stringify({days:st.days,pace:st.pace,interests:[...st.interests],gettingAround:st.travel,stay:st.stay,travellers:st.travelers})}

Rules:
- Exactly ${st.days} days. The trip starts in Cairo.
- Order sites geographically: Cairo-area sites (Matariya, Old Cairo, Maadi) and Wadi El-Natroun (a day trip about 105 km from Cairo) first, then Gabal El-Teir (Minya, about 250 km south), then Al-Muharraq and Mount Dranka (Assiut, about 350-400 km south). Allow realistic travel time between regions.
- Pace: relaxed = at most 1 site per day, balanced = up to 2, full = up to 3.
- Never present PLANNED services (air taxi, high-speed rail) as available today.
- Do not invent names of hotels, restaurants or companies, prices, phone numbers or exact opening hours. Describe types only, e.g. "a guesthouse near the monastery".
- Weave in the traveller's interests. Keep each field to one or two sentences.
- Use "" for fields with nothing to say (e.g. travel on a day without travel).

Reply with only JSON in this shape:
{"title":"...","summary":"...","days":[{"day":1,"title":"...","stopIds":["old-cairo"],"morning":"...","afternoon":"...","evening":"...","travel":"...","overnight":"..."}],"tips":["..."]}`;
}
function validPlan(r,st){
  if(!r||typeof r!=="object"||!Array.isArray(r.days)||!r.days.length) return null;
  const ids=new Set(DATA.stops.map(s=>s.id)), str=x=>typeof x==="string"?x:"";
  return {title:str(r.title)||t("ui.planner.resultTitle",{duration:fmt(st.days,loc().intl,"day")}),summary:str(r.summary),
    days:r.days.slice(0,PD.days.max).map((d,i)=>({day:i+1,title:str(d.title),stopIds:(Array.isArray(d.stopIds)?d.stopIds:[]).filter(x=>ids.has(x)),
      morning:str(d.morning),afternoon:str(d.afternoon),evening:str(d.evening),travel:str(d.travel),overnight:str(d.overnight)})),
    tips:(Array.isArray(r.tips)?r.tips:[]).map(str).filter(Boolean).slice(0,6)};
}
async function generatePlan(){
  const st=planState, err=document.getElementById("pl-err");
  if(!st.stops.size){ err.textContent=t("ui.planner.pickOne"); return; }
  if(!sampleApi){ st.result={...localPlan(st),source:"local"}; renderSheet(); return; }
  st.loading=true; st.ctl=new AbortController(); renderSheet();
  const planLang=lang;
  try{
    const r=await sampleApi.json(aiPrompt(st),{signal:st.ctl.signal,modelTier:"default"});
    const plan=validPlan(r,st);
    st.result=plan?{...plan,source:"ai",lang:planLang}:{...localPlan(st),source:"fallback"};
  }catch(e){
    st.result = e&&e.code==="cancelled" ? null : {...localPlan(st),source:"fallback"};
    if(e&&e.code==="not_granted") sampleApi=null;
  }
  st.loading=false; st.ctl=null;
  if(views.length&&views[views.length-1].kind==="planner") renderSheet();
}
function renderPlan(){
  const r=planState.result;
  if(r.source!=="ai"){ const src=r.source; planState.result={...localPlan(planState),source:src}; }  // local plans re-render in the current language
  const p=planState.result;
  const note=p.source==="ai"?t("ui.planner.aiNote"):p.source==="fallback"?t("ui.planner.fallback"):t("ui.planner.localNote");
  const row=(k,txt)=>txt?`<div class="prow"><dt>${esc(t("ui.planner."+k))}</dt><dd>${esc(txt)}</dd></div>`:"";
  sheetBody.innerHTML=`
  <h3 class="plan-title display">${esc(p.title)}</h3>
  ${p.summary?`<p class="sheet-intro">${esc(p.summary)}</p>`:""}
  <p class="banner">${esc(note)}</p>
  <div class="fp-inline"><span class="partner__icon">${ICONS.flight}</span>
    <div><p class="pcard__name">${esc(t("ui.flights.planTitle"))}</p><p class="pcard__meta">${esc(t("ui.flights.flyTo",{airport:airportShort(FL.airports[0]),partner:fpName()}))}</p></div>
    <button type="button" class="btn-quiet btn-sm" id="pl-fly">${esc(t("ui.flights.view"))}</button></div>
  <ol class="days">${p.days.map(d=>`<li class="dcard">
    <p class="dcard__n">${esc(t("ui.planner.day",{n:fmt(d.day,loc().intl)}))}</p>
    <p class="dcard__title display">${esc(d.title)}</p>
    ${d.stopIds.length?`<div class="dcard__sites">${d.stopIds.map(id=>`<button type="button" class="tag tag--btn" data-goto="${id}">${esc(stopById(id).shortTitle)}</button>`).join("")}</div>`:""}
    <dl>${row("travelLabel",d.travel)}${row("morning",d.morning)}${row("afternoon",d.afternoon)}${row("evening",d.evening)}${row("overnight",d.overnight)}</dl></li>`).join("")}</ol>
  ${p.tips.length?`<h4 class="sub">${esc(t("ui.planner.tips"))}</h4><ul class="hl">${p.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
  <div class="actions"><button type="button" class="btn-gold" id="pl-quote">${esc(t("ui.planner.quote"))}</button><button type="button" class="btn-quiet" id="pl-edit">${esc(t("ui.planner.edit"))}</button></div>`;
  document.getElementById("pl-edit").addEventListener("click",()=>{ planState.result=null; renderSheet(); });
  document.getElementById("pl-quote").addEventListener("click",()=>openAgencies());
  document.getElementById("pl-fly").addEventListener("click",()=>{ views[views.length-1].scroll=sheetBody.scrollTop; openSheet({kind:"flights",form:{to:FL.airports[0].code}}); });
  sheetBody.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>{ closeSheet(); scrollToId(b.dataset.goto); }));
}

/* ---------- entry points: header, tab bar, drawer, booking panel ---------- */
function syncTabs(){
  const k=views.length?({explore:"explore",booking:"explore",done:"explore",agencies:"agencies",planner:"plan",flights:"flights",flightDone:"flights",places:"places"}[views[0].kind]):"journey";
  document.querySelectorAll(".tabbar [data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===k?"page":"false"));
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-open]"); if(!b) return;
  e.preventDefault();
  const what=b.dataset.open;
  if(what==="journey"){ closeSheet(); return; }
  if(what==="gallery"){ closeSheet(); openGallery(b); return; }
  if(views.length && views[0].kind===({explore:"explore",agencies:"agencies",plan:"planner",flights:"flights",places:"places"}[what]) && !b.dataset.airport){ closeSheet(); return; }
  if(views.length){ sheet.hidden=true; backdrop.hidden=true; views=[]; }
  if(what==="explore") openExplore(b.dataset.stop||activeId||DATA.stops[0].id,b.dataset.cat,b);
  if(what==="agencies") openAgencies(b);
  if(what==="plan") openPlanner(b);
  if(what==="flights") openFlights(b.dataset.airport,b);
  if(what==="places") openPlaces(b);
});

/* ---------- other Christian destinations ---------- */
function openPlaces(from){ openSheet({kind:"places"},from); }
let placesGroup="all";
function renderPlaces(v){
  sheetTitle.textContent=t("ui.places.title");
  const card=x=>{ const c=x.i18n[lang]||x.i18n.en, air=(x.airport.name[lang]||x.airport.name.en)+" ("+x.airport.code+")";
    return `<li class="dcard"><figure class="stop-photo" data-photo="${x.id}" hidden></figure>
      <div class="dcard__body"><h3>${esc(c.name)}</h3><p class="region">${esc(c.region)}</p><p class="sum">${esc(c.summary)}</p>
      <ul class="chips">${c.facts.map(f=>`<li class="chip">${esc(f)}</li>`).join("")}</ul>
      <p class="dcard__air">${ICONS.flight}<span>${esc(t("ui.places.nearestAirport",{airport:air}))}</span></p></div></li>`; };
  const groups=["christian","islamic"].filter(g=>placesGroup==="all"||placesGroup===g);
  sheetBody.innerHTML=`<p class="sheet-intro">${esc(t("ui.places.intro"))}</p>
  <div class="seg" role="group">${["all","christian","islamic"].map(g=>`<button type="button" aria-pressed="${g===placesGroup}" data-pgroup="${g}">${esc(t("ui.places."+g))}</button>`).join("")}</div>
  ${groups.map(g=>`${placesGroup==="all"?`<h3 class="dgroup">${esc(t("ui.places."+g))}</h3>`:""}<ul class="dlist">${DATA.destinations.filter(x=>x.group===g).map(card).join("")}</ul>`).join("")}
  <div class="dask"><button type="button" class="btn-gold" data-open="agencies">${esc(t("ui.places.ask"))}</button><p>${esc(t("ui.places.askHint"))}</p></div>`;
  applyPhotos();
}
sheetBody.addEventListener("click",e=>{ const b=e.target.closest("[data-pgroup]"); if(!b) return;
  placesGroup=b.dataset.pgroup; renderPlaces(); const n=sheetBody.querySelector(`[data-pgroup="${placesGroup}"]`); if(n) n.focus({preventScroll:true}); });

/* ---------- gallery page: curtain reveal, masked tiles, tilt on hover, shared-element lightbox ---------- */
const gal=document.getElementById("gallery"), galGrid=document.getElementById("gal-grid"), lb=document.getElementById("lb");
let galOpener=null, lbIndex=-1;
const galItems=()=>DATA.gallery.map(g=>Object.assign({},g,{caption:g.caption[lang]||g.caption.en}));
const motion=()=>!reduce&&!!window.gsap;
function renderGallery(){
  document.getElementById("gal-title").innerHTML=t("ui.gallery.title").split(" ").map(w=>`<span class="w"><span>${esc(w)}</span></span>`).join(" ");
  document.getElementById("gal-intro").textContent=t("ui.gallery.intro");
  document.getElementById("gal-close").setAttribute("aria-label",t("ui.sheet.close"));
  document.getElementById("lb-close").setAttribute("aria-label",t("ui.sheet.close"));
  document.getElementById("lb-prev").setAttribute("aria-label",t("ui.gallery.prev"));
  document.getElementById("lb-next").setAttribute("aria-label",t("ui.gallery.next"));
  galGrid.innerHTML=galItems().map((g,i)=>`<li class="gal__item"><button type="button" class="tile" data-i="${i}" aria-label="${esc(g.caption)}">
    <span class="tile__mask" style="aspect-ratio:${g.w}/${g.h}"><img src="${esc(g.src)}" alt="" width="${g.w}" height="${g.h}" decoding="async"></span>
    <span class="tile__cap"><i class="hb-num">${fmt(i+1,loc().intl)}</i><span>${esc(g.caption)}</span></span></button></li>`).join("");
  if(!lb.hidden) lbShow(lbIndex);
}
function openGallery(from){
  if(!gal.hidden) return;
  galOpener=from||document.activeElement; renderGallery();
  const r=from&&from.getBoundingClientRect?from.getBoundingClientRect():null;
  const ox=r&&r.width?r.left+r.width/2:innerWidth/2, oy=r&&r.width?r.top+r.height/2:innerHeight/2;
  gal.hidden=false; html.classList.add("gal-open"); gal.querySelector(".gal__scroll").scrollTop=0;
  document.getElementById("gal-close").focus({preventScroll:true});
  if(!motion()) return;
  const R=Math.hypot(Math.max(ox,innerWidth-ox),Math.max(oy,innerHeight-oy))+40;
  gsap.killTweensOf(gal); gsap.set(gal,{autoAlpha:1});
  gsap.fromTo(gal,{clipPath:`circle(0px at ${ox}px ${oy}px)`},{clipPath:`circle(${R}px at ${ox}px ${oy}px)`,duration:.95,ease:"power3.inOut",onComplete:()=>{ gal.style.clipPath=""; }});
  gsap.fromTo(gal.querySelectorAll(".gal__title .w>span"),{yPercent:120},{yPercent:0,duration:.95,ease:"power4.out",stagger:.09,delay:.35});
  gsap.fromTo(gal.querySelector(".gal__intro"),{autoAlpha:0,y:14},{autoAlpha:1,y:0,duration:.7,delay:.6});
  gsap.fromTo(gal.querySelector(".gal__rule"),{scaleX:0},{scaleX:1,duration:1.1,ease:"power3.out",delay:.6});
  gal.querySelectorAll(".tile").forEach((tile,i)=>{
    const d=.6+i*.11;
    gsap.fromTo(tile.querySelector(".tile__mask"),{clipPath:"inset(100% 0% 0% 0%)"},{clipPath:"inset(0% 0% 0% 0%)",duration:1.15,ease:"expo.out",delay:d,clearProps:"clipPath"});
    gsap.fromTo(tile.querySelector("img"),{scale:1.35},{scale:1,duration:1.6,ease:"expo.out",delay:d});
    gsap.fromTo(tile.querySelector(".tile__cap"),{autoAlpha:0,y:10},{autoAlpha:1,y:0,duration:.6,delay:d+.4});
  });
}
function closeGallery(){
  if(gal.hidden) return;
  if(!lb.hidden){ lb.hidden=true; galGrid.querySelectorAll(".tile__mask").forEach(m=>{ m.style.opacity=""; }); }
  const done=()=>{ gal.hidden=true; gal.style.clipPath=""; html.classList.remove("gal-open"); if(galOpener&&galOpener.focus) galOpener.focus({preventScroll:true}); };
  if(!motion()){ done(); return; }
  gsap.killTweensOf(gal);
  gsap.fromTo(gal,{clipPath:"inset(0% 0% 0% 0%)"},{clipPath:"inset(0% 0% 100% 0%)",duration:.6,ease:"power3.inOut",onComplete:done});
}
function lbRect(g){ const k=Math.min(Math.min(innerWidth*.92,g.w*1.6)/g.w, Math.min(innerHeight*.7,g.h*1.6)/g.h); return {w:Math.round(g.w*k),h:Math.round(g.h*k)}; }
function lbShow(i){
  const items=galItems(); lbIndex=(i+items.length)%items.length; const g=items[lbIndex], img=lb.querySelector("img"), R=lbRect(g);
  img.src=g.src; img.alt=g.caption; img.style.width=R.w+"px"; img.style.height=R.h+"px";
  lb.querySelector("figcaption").textContent=g.caption;
  lb.querySelector(".lb__count").textContent=fmt(lbIndex+1,loc().intl)+" / "+fmt(items.length,loc().intl);
  galGrid.querySelectorAll(".tile__mask").forEach((m,j)=>{ m.style.opacity=j===lbIndex?"0":""; });
}
function openLightbox(i){
  const src=galGrid.querySelector(`.tile[data-i="${i}"] .tile__mask`); if(!src) return;
  const from=src.getBoundingClientRect();
  lb.hidden=false; lbShow(i); document.getElementById("lb-close").focus({preventScroll:true});
  if(!motion()) return;
  const img=lb.querySelector("img"); gsap.killTweensOf(img); gsap.set(img,{clearProps:"transform,opacity,visibility"});
  const to=img.getBoundingClientRect();
  gsap.fromTo(lb.querySelector(".lb__shade"),{opacity:0},{opacity:1,duration:.5});
  gsap.fromTo(img,{x:from.left-to.left,y:from.top-to.top,scaleX:from.width/to.width,scaleY:from.height/to.height,transformOrigin:"0 0"},{x:0,y:0,scaleX:1,scaleY:1,duration:.8,ease:"power4.inOut"});
  gsap.fromTo(lb.querySelectorAll("figcaption,.lb__count,.icon-btn"),{autoAlpha:0},{autoAlpha:1,duration:.4,delay:.5});
}
function closeLightbox(){
  if(lb.hidden) return;
  const src=galGrid.querySelector(`.tile[data-i="${lbIndex}"] .tile__mask`);
  const done=()=>{ lb.hidden=true; galGrid.querySelectorAll(".tile__mask").forEach(m=>{ m.style.opacity=""; }); const b=galGrid.querySelector(`.tile[data-i="${lbIndex}"]`); if(b) b.focus({preventScroll:true}); };
  if(!motion()||!src){ done(); return; }
  src.scrollIntoView({block:"nearest"});
  const img=lb.querySelector("img"), a=img.getBoundingClientRect(), b=src.getBoundingClientRect();
  gsap.to(lb.querySelectorAll("figcaption,.lb__count,.icon-btn"),{autoAlpha:0,duration:.2});
  gsap.to(lb.querySelector(".lb__shade"),{opacity:0,duration:.5,delay:.1});
  gsap.to(img,{x:b.left-a.left,y:b.top-a.top,scaleX:b.width/a.width,scaleY:b.height/a.height,transformOrigin:"0 0",duration:.6,ease:"power3.inOut",onComplete:()=>{ done(); gsap.set(img,{clearProps:"transform"}); }});
}
function lbGo(step){
  const img=lb.querySelector("img"), cap=lb.querySelector("figcaption"), sgn=step*getDirSign();
  if(!motion()){ lbShow(lbIndex+step); return; }
  gsap.killTweensOf([img,cap]);
  gsap.to([img,cap],{x:-46*sgn,autoAlpha:0,duration:.22,ease:"power2.in",onComplete:()=>{ lbShow(lbIndex+step);
    gsap.fromTo(img,{x:46*sgn,autoAlpha:0,scale:1.04},{x:0,autoAlpha:1,scale:1,duration:.5,ease:"power3.out"});
    gsap.fromTo(cap,{x:0,y:8,autoAlpha:0},{y:0,autoAlpha:1,duration:.4,delay:.12}); }});
}
galGrid.addEventListener("click",e=>{ const b=e.target.closest(".tile"); if(b) openLightbox(+b.dataset.i); });
document.getElementById("gal-close").addEventListener("click",closeGallery);
document.getElementById("lb-close").addEventListener("click",closeLightbox);
lb.querySelector(".lb__shade").addEventListener("click",closeLightbox);
document.getElementById("lb-prev").addEventListener("click",()=>lbGo(-1));
document.getElementById("lb-next").addEventListener("click",()=>lbGo(1));
document.addEventListener("keydown",e=>{
  if(gal.hidden) return;
  if(e.key==="Escape"){ if(!lb.hidden) closeLightbox(); else closeGallery(); }
  else if(!lb.hidden && (e.key==="ArrowRight"||e.key==="ArrowLeft")) lbGo((e.key==="ArrowRight"?1:-1)*getDirSign());
});
{ let sx=null; lb.addEventListener("pointerdown",e=>{ sx=e.clientX; });
  lb.addEventListener("pointerup",e=>{ if(sx==null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>48) lbGo((dx<0?1:-1)*getDirSign()); }); }
if(window.matchMedia("(hover:hover) and (pointer:fine)").matches){
  galGrid.addEventListener("pointermove",e=>{ if(!motion()) return; const tile=e.target.closest(".tile"); if(!tile) return;
    const r=tile.getBoundingClientRect(), px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
    gsap.to(tile,{rotateY:px*9,rotateX:-py*9,duration:.5,ease:"power2.out",overwrite:"auto"});
    gsap.to(tile.querySelector("img"),{x:-px*14,y:-py*14,scale:1.08,duration:.6,ease:"power2.out",overwrite:"auto"}); });
  galGrid.addEventListener("pointerout",e=>{ if(!motion()) return; const tile=e.target.closest(".tile"); if(!tile||tile.contains(e.relatedTarget)) return;
    gsap.to(tile,{rotateY:0,rotateX:0,duration:.7,ease:"power3.out",overwrite:"auto"});
    gsap.to(tile.querySelector("img"),{x:0,y:0,scale:1,duration:.8,ease:"power3.out",overwrite:"auto"}); });
}

/* ---------- boot ---------- */
buildMap(); buildContent(); applyLanguage();
activeId=null; Object.assign(cam,camFor(null)); markDirty();
initScroll();
initCapabilities();
try{ const o=new URLSearchParams(location.search).get("open"); if(o==="plan") openPlanner(); else if(o==="agencies") openAgencies(); else if(o==="explore") openExplore(); else if(o==="flights") openFlights(); else if(o==="places") openPlaces(); else if(o==="gallery") openGallery(); }catch(e){}

/* ---------- opening screen: logo and invitation; the app appears only when the visitor presses the button ---------- */
(function(){
  window.__hbBooted=true;
  const L=document.getElementById("loader"); if(!L) return;
  const line=document.getElementById("loader-line"), start=document.getElementById("loader-start");
  let skip=false; try{ skip=new URLSearchParams(location.search).get("intro")==="0"; }catch(e){}
  let done=false, isReady=false;
  function finish(){
    if(done) return; done=true;
    const logo=document.getElementById("loader-logo"), brand=document.querySelector(".brand__logo");
    const end=()=>{ html.classList.remove("is-loading"); if(brand) brand.style.opacity=""; L.remove(); };
    if(reduce||!window.gsap||!brand||!logo.getBoundingClientRect().width){ L.style.transition="opacity .45s"; L.style.opacity="0"; setTimeout(end,460); return; }
    logo.style.animation="none";
    const a=logo.getBoundingClientRect(), b=brand.getBoundingClientRect();
    const k=b.height/a.height, tx=(b.left+b.height*(parseFloat(brand.dataset.iconCx)||.62))-(a.left+a.width/2), ty=(b.top+b.height/2)-(a.top+a.height/2);
    gsap.timeline({onComplete:end})
      .to(L.querySelectorAll(".loader__ring,.loader__wordmark,.loader__gate"),{autoAlpha:0,duration:.4,ease:"power1.out"},0)
      .to(logo,{x:tx,y:ty,scale:k,duration:1.05,ease:"power3.inOut"},.15)
      .to(L.querySelector(".loader__bg"),{opacity:0,duration:.8,ease:"power2.inOut"},.35)
      .to(brand,{opacity:1,duration:.35},.98)
      .to(logo,{autoAlpha:0,duration:.3},1.02);
  }
  function ready(){
    if(isReady) return; isReady=true;
    line.textContent=t("ui.intro.line"); start.querySelector("span").textContent=t("ui.intro.start"); L.setAttribute("aria-label",t("ui.siteTitle"));
    if(skip){ finish(); return; }
    L.classList.add("is-ready"); setTimeout(()=>{ try{ start.focus({preventScroll:true}); }catch(e){} },850);
  }
  start.addEventListener("click",finish);
  const go=()=>setTimeout(ready,Math.max(300,1500-performance.now()));
  if(document.readyState==="complete") go(); else window.addEventListener("load",go);
  setTimeout(ready,6000);   /* slow connection: offer the button without waiting for every font and image */
})();
loadSitePhotos();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(hasGSAP) ScrollTrigger.refresh(); });
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(onResize,120); });
})();
</script>
</body>
