<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0d0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holy Booking</title>
<link rel="icon" type="image/png" href="assets/brand/icon-180.png?v=3">
<link rel="apple-touch-icon" href="assets/brand/icon-180.png?v=3">

<noscript><style>.loader{display:none!important}</style></noscript>
<script>
/* no-flash: set lang/dir before first paint */
(function(){try{var s=["en","ar","de"],m={en:["en","ltr"],ar:["ar-EG","rtl"],de:["de","ltr"]},q=null,l=null;
try{q=new URLSearchParams(location.search).get("lang")}catch(e){}try{l=localStorage.getItem("hb.lang")}catch(e){}
var n=(navigator.language||"").slice(0,2),c=[q,l,n].find(function(x){return s.indexOf(x)>-1})||"en";
document.documentElement.lang=m[c][0];document.documentElement.dir=m[c][1];}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Reem+Kufi:wght@400;500;600&family=Alegreya:ital,wght@0,400;0,500;1,400&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Sans+Coptic&family=DM+Sans:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:13 13 16; --basalt:30 27 24; --land:34 31 27; --gold:201 164 92; --gold-soft:228 207 156; --papyrus:238 229 209; --dust:154 143 123;
  --font-display:"Cinzel","Trajan Pro",Georgia,serif;
  --font-body:"Alegreya",Georgia,"Times New Roman",serif;
  --font-coptic:"Noto Sans Coptic","Antinoou",serif;
  --leading-body:1.6; --text-scale:1;
  color-scheme:dark;
}
:root:lang(ar){
  --font-display:"Reem Kufi","Amiri",serif;
  --font-body:"Noto Naskh Arabic","Amiri",serif;
  --leading-body:1.85; --text-scale:1.06;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-behavior:auto; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; background:rgb(var(--ink)); color:rgb(var(--papyrus));
  font-family:var(--font-body); font-size:calc(1rem * var(--text-scale)); line-height:var(--leading-body);
  -webkit-font-smoothing:antialiased;
}
:lang(ar) .display, :lang(ar) h1, :lang(ar) h2{ letter-spacing:0 !important; }
:lang(de) .hb-hyphenate{ hyphens:auto; overflow-wrap:break-word; }
:lang(en){ quotes:"\201C" "\201D" "\2018" "\2019"; }
:lang(de){ quotes:"\201E" "\201C" "\201A" "\2018"; }
:lang(ar){ quotes:"\00AB" "\00BB" "\2039" "\203A"; }
.hb-scripture::before{ content:open-quote; } .hb-scripture::after{ content:close-quote; }
.hb-num{ font-variant-numeric:lining-nums tabular-nums; }
.display{ font-family:var(--font-display); font-weight:400; }
[dir="rtl"] .hb-flip{ transform:scaleX(-1); }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
:focus-visible{ outline:1px solid rgb(var(--gold)); outline-offset:3px; }

/* glass */
.hb-glass{
  background:rgb(var(--basalt) / .55);
  -webkit-backdrop-filter:blur(18px) saturate(120%); backdrop-filter:blur(18px) saturate(120%);
  border:1px solid rgb(var(--gold) / .2); border-radius:6px;
  box-shadow:0 30px 80px -40px rgb(0 0 0 / .8);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .hb-glass{ background:rgb(var(--basalt) / .94); } }

/* language crossfade */
[data-i18n-fade]{ transition:opacity 180ms ease; }
html[data-lang-switching] [data-i18n-fade]{ opacity:0; }

/* skip link */
.skip{ position:fixed; inset-inline-start:16px; top:-60px; z-index:50; background:rgb(var(--ink)); color:rgb(var(--gold-soft)); padding:8px 12px; border-radius:4px; }
.skip:focus{ top:calc(16px + env(safe-area-inset-top,0px)); }

/* header */
.hb-header{ position:fixed; inset-inline:0; top:0; z-index:30; padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0; }
.hb-header__bar{ max-width:72rem; margin-inline:auto; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:10px 14px 10px 20px; padding-inline-start:20px; padding-inline-end:10px; }
.brand{ display:inline-flex; align-items:center; flex:none; text-decoration:none; }
.brand__logo{ display:block; height:40px; width:auto; }
html.is-loading{ overflow:hidden; } html.is-loading .brand__logo{ opacity:0; }

/* ---------- opening animation: the emblem appears, then flies into the header ---------- */
.loader{ position:fixed; inset:0; z-index:200; display:grid; place-content:center; justify-items:center; gap:22px; padding:24px; text-align:center; }
.loader__bg{ position:absolute; inset:0; background:radial-gradient(110% 85% at 50% 42%, rgb(36 32 26), rgb(var(--ink)) 72%); }
.loader__seal{ position:relative; width:min(64vw,264px); aspect-ratio:1; display:grid; place-items:center; }
.loader__logo{ position:relative; width:78%; height:auto; animation:ld-in 1.1s cubic-bezier(.2,.8,.2,1) both; will-change:transform,opacity; }
.loader__ring{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.loader__ring circle{ fill:none; stroke:rgb(var(--gold) / .16); stroke-width:1; }
.loader__ring .arc{ stroke:rgb(var(--gold)); stroke-width:1.5; stroke-linecap:round; stroke-dasharray:140 464; transform-origin:50% 50%; animation:ld-spin 1.5s linear infinite; }
.loader__ring circle, .loader__ring .arc{ transition:stroke .8s, opacity .6s; }
.loader.is-ready .loader__ring .arc{ opacity:0; } .loader.is-ready .loader__ring circle{ stroke:rgb(var(--gold) / .45); }
.loader__wordmark{ position:relative; width:min(66vw,250px); height:auto; animation:ld-fade 1s .35s both; }
/* the app waits behind this screen until the visitor presses the button */
.loader__gate{ position:relative; display:grid; justify-items:center; gap:22px; min-height:128px; margin-top:6px; opacity:0; visibility:hidden; transform:translateY(10px); transition:opacity .8s ease, transform .8s ease, visibility 0s .8s; }
.loader.is-ready .loader__gate{ opacity:1; visibility:visible; transform:none; transition:opacity .8s ease, transform .8s ease; }
.loader__line{ margin:0; max-width:21rem; font-family:var(--font-body); font-style:italic; font-size:1.18rem; line-height:1.5; color:rgb(var(--papyrus) / .9); text-wrap:balance; }
:lang(ar) .loader__line{ font-style:normal; line-height:1.9; }
@media (max-height:620px){ .loader__seal{ width:min(40vw,160px); } .loader{ gap:14px; } }
@keyframes ld-in{ from{ opacity:0; transform:scale(.86) translateY(8px); filter:blur(6px); } to{ opacity:1; transform:none; filter:none; } }
@keyframes ld-spin{ to{ transform:rotate(360deg); } }
@keyframes ld-fade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .loader__logo,.loader__wordmark,.loader__ring .arc{ animation:none; } .loader__gate{ transition:none; } }

/* ---------- other destinations (sheet) ---------- */
.dlist{ list-style:none; margin:14px 0 0; padding:0; display:grid; gap:14px; }
.dgroup{ margin:26px 0 0; font-family:var(--font-display); font-weight:400; font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; color:rgb(var(--gold)); }
:lang(ar) .dgroup{ letter-spacing:0; font-size:1rem; }
.dcard{ border:1px solid rgb(var(--gold) / .16); border-radius:8px; background:rgb(var(--ink) / .4); overflow:hidden; }
.dcard .stop-photo{ display:block; margin:0; } .dcard .stop-photo[hidden]{ display:none; }
.dcard .stop-photo__frame{ border-radius:0; box-shadow:none; aspect-ratio:16/9; }
.dcard .credit{ margin:6px 14px 0; }
.dcard__body{ padding:14px; display:grid; gap:8px; }
.dcard h3{ margin:0; font-family:var(--font-display); font-weight:400; font-size:1.15rem; line-height:1.3; color:rgb(var(--gold-soft)); }
:lang(ar) .dcard h3{ line-height:1.6; }
.dcard .region{ margin:0; font-size:.82rem; color:rgb(var(--dust)); }
.dcard p.sum{ margin:0; font-size:.93rem; color:rgb(var(--papyrus) / .86); }
.dcard__air{ margin:0; display:flex; align-items:center; gap:8px; font-size:.82rem; color:rgb(var(--papyrus) / .7); }
.dcard__air svg{ width:16px; height:16px; flex:none; fill:none; stroke:rgb(var(--gold)); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.dask{ margin-top:18px; display:grid; gap:8px; justify-items:start; } .dask p{ margin:0; font-size:.82rem; color:rgb(var(--dust)); }

/* ---------- gallery page ---------- */
html.gal-open{ overflow:hidden; }
.gal{ position:fixed; inset:0; z-index:70; background:radial-gradient(120% 80% at 50% 0%, rgb(34 30 25), rgb(var(--ink)) 60%); display:flex; flex-direction:column; }
.gal[hidden]{ display:none; }
.gal__bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px; }
.gal__bar img{ height:32px; width:auto; display:block; }
.gal__scroll{ flex:1; overflow:auto; overscroll-behavior:contain; padding:10px 18px calc(48px + env(safe-area-inset-bottom,0px)); }
.gal__head{ max-width:68rem; margin:0 auto 26px; }
.gal__title{ margin:0; font-family:var(--font-display); font-weight:400; font-size:clamp(2.4rem,8vw,5rem); line-height:1.08; color:rgb(var(--gold-soft)); }
:lang(ar) .gal__title{ line-height:1.5; }
.gal__title .w{ display:inline-block; overflow:hidden; vertical-align:bottom; padding-bottom:.08em; } .gal__title .w>span{ display:inline-block; }
.gal__intro{ margin:10px 0 0; max-width:34rem; color:rgb(var(--papyrus) / .78); }
.gal__rule{ display:block; height:1px; margin-top:22px; background:linear-gradient(90deg, rgb(var(--gold) / .7), transparent); transform-origin:left; }
[dir="rtl"] .gal__rule{ background:linear-gradient(270deg, rgb(var(--gold) / .7), transparent); }
.gal__grid{ list-style:none; margin:0 auto; padding:0; max-width:68rem; columns:2; column-gap:12px; }
@media (min-width:760px){ .gal__grid{ columns:3; column-gap:18px; } .gal__bar,.gal__scroll{ padding-inline:40px; } }
.gal__item{ break-inside:avoid; margin:0 0 12px; perspective:900px; }
@media (min-width:760px){ .gal__item{ margin-bottom:18px; } }
.tile{ display:block; width:100%; padding:0; border:0; background:none; color:inherit; font:inherit; text-align:start; cursor:zoom-in; transform-style:preserve-3d; }
.tile__mask{ display:block; position:relative; overflow:hidden; border-radius:4px; background:rgb(var(--basalt)); box-shadow:0 0 0 1px rgb(var(--gold) / .18), 0 24px 40px -28px rgb(0 0 0 / .9); }
.tile__mask img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.tile__mask::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgb(var(--ink) / .55)); opacity:0; transition:opacity .4s; }
.tile:hover .tile__mask::after, .tile:focus-visible .tile__mask::after{ opacity:1; }
.tile:focus-visible{ outline:2px solid rgb(var(--gold)); outline-offset:4px; }
.tile__cap{ display:flex; gap:10px; align-items:baseline; padding:8px 2px 0; font-size:.82rem; line-height:1.4; color:rgb(var(--papyrus) / .8); }
.tile__cap i{ font-style:normal; font-family:var(--font-display); font-size:.72rem; color:rgb(var(--gold)); flex:none; }
.lb{ position:fixed; inset:0; z-index:5; display:grid; place-items:center; touch-action:pan-y; }
.lb[hidden]{ display:none; }
.lb__shade{ position:absolute; inset:0; background:rgb(8 8 10 / .94); backdrop-filter:blur(6px); }
.lb figure{ position:relative; margin:0; display:grid; justify-items:center; gap:14px; }
.lb figure img{ display:block; border-radius:3px; box-shadow:0 0 0 1px rgb(var(--gold) / .3), 0 40px 80px -30px #000; object-fit:cover; }
.lb figcaption{ max-width:min(90vw,40rem); text-align:center; font-size:.95rem; color:rgb(var(--papyrus) / .9); }
.lb__count{ position:absolute; top:calc(20px + env(safe-area-inset-top,0px)); inset-inline-start:22px; font-family:var(--font-display); font-size:.85rem; letter-spacing:.14em; color:rgb(var(--gold-soft)); }
.lb__close{ position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); inset-inline-end:16px; }
.lb__nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgb(var(--ink) / .5); }
.lb__nav--prev{ inset-inline-start:12px; } .lb__nav--next{ inset-inline-end:12px; }
@media (max-width:759px){ .lb__nav{ top:auto; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:none; } .lb__nav--prev{ inset-inline-start:calc(50% - 56px); } .lb__nav--next{ inset-inline-end:calc(50% - 56px); } }
.hb-nav ul{ display:flex; gap:26px; list-style:none; margin:0; padding:0; font-size:.875rem; }
.hb-nav a{ color:rgb(var(--papyrus) / .72); text-decoration:none; transition:color .2s; }
.hb-nav a:hover{ color:rgb(var(--papyrus)); }
@media (max-width:860px){ .hb-nav{ display:none; } }
.lang-switch{ display:flex; gap:2px; }
.lang-switch button{ font:inherit; font-size:.85rem; line-height:1.4; background:none; border:0; color:rgb(var(--papyrus) / .68); padding:6px 12px; border-radius:999px; cursor:pointer; transition:background .2s,color .2s; }
.lang-switch button:hover{ color:rgb(var(--papyrus)); }
.lang-switch button[aria-pressed="true"]{ background:rgb(var(--gold) / .15); color:rgb(var(--gold-soft)); }
.lang-switch button:lang(ar){ font-family:"Noto Naskh Arabic",serif; }
.lang-switch button:lang(en), .lang-switch button:lang(de){ font-family:"Alegreya",serif; }

/* map */
.map-layer{ position:fixed; inset:0; z-index:0; overflow:hidden; background:rgb(var(--ink)); }

.map-overlay{ position:absolute; inset:0; pointer-events:none; }
.pin{ position:absolute; left:0; top:0; width:0; height:0; will-change:transform; }
.pin.is-hidden{ visibility:hidden; }
.map-label{ position:absolute; top:0; white-space:nowrap; transform:translateY(-50%); pointer-events:none; }
.map-label--city{ inset-inline-start:-3px; color:rgb(var(--dust) / .85); font-size:.74rem; text-shadow:0 1px 6px rgb(var(--ink)); }
.map-label--city::before{ content:""; display:inline-block; width:4px; height:4px; border-radius:50%; background:rgb(var(--dust) / .8); margin-inline-end:6px; vertical-align:middle; }
.map-label--city.rank-1{ color:rgb(var(--papyrus) / .7); font-size:.8rem; }
.map-label--region, .map-label--sea, .map-label--water{ left:0; transform:translate(-50%,-50%); font-family:var(--font-display); font-style:normal; font-weight:500; }
.map-label--region{ font-size:1.05rem; color:rgb(var(--papyrus) / .22); letter-spacing:.02em; }
.map-label--sea{ font-size:1.1rem; color:rgb(var(--gold) / .38); }
.map-label--water{ font-size:.92rem; color:rgb(var(--gold) / .55); }
:lang(ar) .map-label--region, :lang(ar) .map-label--sea, :lang(ar) .map-label--water{ font-style:normal; letter-spacing:0; }

.hb-marker{ position:absolute; left:0; top:0; transform:translate(-50%,-50%); pointer-events:auto; display:grid; place-items:center; width:30px; height:30px; padding:0; background:none; border:0; cursor:pointer; color:inherit; font:inherit; }
.hb-marker__dot{ width:10px; height:10px; border-radius:50%; background:rgb(var(--gold)); box-shadow:0 0 0 4px rgb(var(--gold) / .16), 0 0 0 1px rgb(var(--ink)); transition:transform .4s ease, box-shadow .4s ease; }
.hb-marker:hover .hb-marker__dot{ transform:scale(1.25); }
.hb-marker.is-active .hb-marker__dot{ transform:scale(1.5); box-shadow:0 0 0 10px rgb(var(--gold) / .14), 0 0 34px rgb(var(--gold) / .55); }
.hb-marker__label{ position:absolute; inset-inline-start:calc(100% - 4px); top:50%; transform:translateY(-50%); white-space:nowrap; font-family:var(--font-display); font-size:.95rem; color:rgb(var(--papyrus) / .8); text-shadow:0 1px 8px rgb(var(--ink)), 0 0 2px rgb(var(--ink)); pointer-events:none; transition:color .3s; }
.hb-marker.is-active .hb-marker__label{ color:rgb(var(--gold-soft)); }
.hb-marker:focus-visible{ outline:1px solid rgb(var(--gold)); border-radius:50%; }
.hb-pop{ position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); width:max-content; max-width:220px; text-align:start; padding:10px 12px; border-radius:6px; background:rgb(var(--basalt) / .95); border:1px solid rgb(var(--gold) / .25); opacity:0; visibility:hidden; transition:opacity .2s; pointer-events:none; }
.hb-marker:not(.is-active):hover .hb-pop, .hb-marker:not(.is-active):focus-visible .hb-pop{ opacity:1; visibility:visible; }
.hb-pop strong{ display:block; font-family:var(--font-display); font-weight:400; font-size:1rem; color:rgb(var(--gold-soft)); }
.hb-pop span{ display:block; font-size:.82rem; line-height:1.45; margin-top:2px; color:rgb(var(--papyrus) / .85); }

/* image card anchored to the active spot */
.map-card{ position:absolute; left:0; top:0; width:300px; transform:translate(-50%, calc(-100% - 26px)); pointer-events:auto; padding:8px; opacity:0; visibility:hidden; transition:opacity .45s ease, visibility .45s; }
.map-card.is-open{ opacity:1; visibility:visible; }
.map-card::after{ content:""; position:absolute; left:50%; bottom:-7px; width:12px; height:12px; transform:translateX(-50%) rotate(45deg); background:rgb(var(--basalt) / .9); border-inline-end:1px solid rgb(var(--gold) / .2); border-bottom:1px solid rgb(var(--gold) / .2); }
[dir="rtl"] .map-card::after{ border-inline-end:0; border-inline-start:1px solid rgb(var(--gold) / .2); }
.map-card__frame{ position:relative; aspect-ratio:400/260; border-radius:3px; overflow:hidden; background:linear-gradient(170deg, rgb(38 34 29), rgb(var(--ink))); }
.map-card__frame img, .map-card__frame svg{ position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; }
.map-card__frame img{ opacity:0; transition:opacity .5s; } .map-card__frame img.is-loaded{ opacity:1; }
.illus .s1{ fill:none; stroke:rgb(var(--gold-soft)); stroke-width:1.6; }
.illus .s2{ fill:none; stroke:rgb(var(--gold)); stroke-width:1.1; opacity:.85; }
.illus .s3{ fill:none; stroke:rgb(var(--gold)); stroke-width:1; opacity:.4; }
.illus .merlon{ fill:none; stroke:rgb(var(--gold-soft)); stroke-width:8; stroke-dasharray:10 10; }
.illus path, .illus circle, .illus ellipse, .illus rect{ stroke-linecap:round; stroke-linejoin:round; }
.map-card__meta{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:10px 4px 2px; }
.map-card__title{ margin:0; font-family:var(--font-display); font-size:1.05rem; line-height:1.3; color:rgb(var(--gold-soft)); }
.map-card__tag{ font-size:.7rem; color:rgb(var(--dust)); white-space:nowrap; }
.map-card__tools{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px 4px 2px; border-top:1px solid rgb(var(--gold) / .12); margin-top:8px; }
.map-card__tools[hidden]{ display:none; }
/* site photos (Wikimedia Commons) with credit line */
.credit{ margin:6px 0 0; font-size:.68rem; line-height:1.45; color:rgb(var(--dust)); overflow-wrap:anywhere; }
.credit a{ color:inherit; text-decoration:underline; text-decoration-color:rgb(var(--gold) / .4); text-underline-offset:2px; }
.credit a:hover{ color:rgb(var(--gold-soft)); }
.map-card__credit{ padding:0 4px 2px; } .map-card__credit[hidden]{ display:none; }
.stop-photo{ margin:0 0 20px; } .stop-photo[hidden]{ display:none; }
.stop-photo__frame{ aspect-ratio:16/10; border-radius:4px; overflow:hidden; background:linear-gradient(170deg, rgb(38 34 29), rgb(var(--ink))); box-shadow:0 0 0 1px rgb(var(--gold) / .2); }
.stop-photo img{ display:block; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .5s; } .stop-photo img.is-loaded{ opacity:1; }
.tool{ font:inherit; font-size:.75rem; color:rgb(var(--papyrus) / .85); background:rgb(var(--gold) / .1); border:1px solid rgb(var(--gold) / .3); border-radius:999px; padding:4px 11px; cursor:pointer; }
.tool:hover{ background:rgb(var(--gold) / .2); }
.tool:focus-within{ outline:1px solid rgb(var(--gold)); outline-offset:2px; }
.tool input{ position:absolute; width:1px; height:1px; opacity:0; }
.tool--quiet{ background:none; border-color:transparent; color:rgb(var(--dust)); }
.tool-status{ font-size:.72rem; color:rgb(var(--dust)); }
@media (max-width:899px){
  .map-card{ width:230px; transform:translate(-50%, 26px); }
  .map-card::after{ bottom:auto; top:-7px; transform:translateX(-50%) rotate(225deg); }
}

.vignette{ position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(to bottom, rgb(var(--ink) / .75), transparent 16%),
    linear-gradient(to left, rgb(var(--ink) / .7), transparent 40%),
    radial-gradient(ellipse at center, transparent 50%, rgb(var(--ink) / .7)); }
[dir="rtl"] .vignette{
  background:
    linear-gradient(to bottom, rgb(var(--ink) / .75), transparent 16%),
    linear-gradient(to right, rgb(var(--ink) / .7), transparent 40%),
    radial-gradient(ellipse at center, transparent 50%, rgb(var(--ink) / .7)); }


#map-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.no-3d .flat-map{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.9; }
.no-3d .map-overlay .pin{ display:none; }

.partner-pin{ position:absolute; left:0; top:0; transform:translate(-50%,-50%); pointer-events:auto; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; padding:0; cursor:pointer;

.metric dt{ font-size:.82rem; color:rgb(var(--dust)); }

.hero__actions{ display:flex; flex-wrap:wrap; align-items:center; gap:18px 26px; margin-top:36px; }
.btn-gold{ display:inline-flex; align-items:center; gap:10px; padding:11px 22px; border-radius:999px; border:1px solid rgb(var(--gold) / .6); background:rgb(var(--gold) / .12); color:rgb(var(--gold-soft)); font:inherit; font-size:.95rem; text-decoration:none; cursor:pointer; transition:background .25s,border-color .25s; }
.btn-gold:hover{ background:rgb(var(--gold) / .22); border-color:rgb(var(--gold)); }
.btn-gold svg{ width:12px; height:12px; }
.hint{ font-size:.82rem; color:rgb(var(--dust)); }

.stop{ min-height:170vh; display:flex; align-items:flex-start; justify-content:flex-end; padding:22vh 14px 0; }
@media (min-width:768px){ .stop .drawer{ position:sticky; top:calc(96px + env(safe-area-inset-top,0px)); max-height:calc(100vh - 120px); overflow:auto; scrollbar-width:thin; } }
@media (min-width:768px){ .stop{ padding-inline:40px; } }
@media (max-width:767px){ .stop{ align-items:flex-end; padding-bottom:12vh; } }
.drawer{ width:100%; max-width:26rem; padding:28px; }
@media (min-width:768px){ .drawer{ padding:36px; } }
.drawer .kicker{ margin:0; font-size:.82rem; color:rgb(var(--gold) / .85); }
.drawer h2{ margin:10px 0 4px; font-family:var(--font-display); font-weight:400; font-size:clamp(1.7rem,2.6vw,2.15rem); line-height:1.15; color:rgb(var(--gold-soft)); }
:lang(ar) .drawer h2{ line-height:1.5; }
.drawer .region{ margin:0; font-size:.85rem; color:rgb(var(--dust)); }
.drawer .summary{ margin:18px 0 0; color:rgb(var(--papyrus) / .92); }
.drawer h3{ margin:26px 0 10px; font-size:.82rem; font-weight:500; color:rgb(var(--gold) / .85); }
.hl{ list-style:none; margin:0; padding:0; display:grid; gap:9px; }
.hl li{ position:relative; padding-inline-start:20px; color:rgb(var(--papyrus) / .86); font-size:.95rem; }
.hl li::before{ content:""; position:absolute; inset-inline-start:0; top:.8em; width:10px; height:1px; background:rgb(var(--gold) / .6); }
.chips{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:1px solid rgb(var(--gold) / .4); border-radius:999px; padding:3px 12px; font-size:.78rem; }
.chip--planned{ border-style:dashed; border-color:rgb(var(--dust) / .5); color:rgb(var(--dust)); }
.chip--planned em{ font-style:normal; opacity:.8; margin-inline-start:4px; }
.chip small{ opacity:.75; font-size:inherit; }
.book-link{ margin-top:28px; display:inline-flex; align-items:center; gap:8px; color:rgb(var(--gold-soft)); text-decoration:underline; text-decoration-color:rgb(var(--gold) / .4); text-underline-offset:5px; }
.book-link:hover{ text-decoration-color:rgb(var(--gold)); }
.book-link svg{ width:12px; height:12px; }

.booking{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:80px 20px; }
.booking__panel{ max-width:34rem; padding:44px; text-align:center; }
.booking__panel h2{ margin:0; font-size:clamp(2.2rem,4vw,3rem); color:rgb(var(--gold-soft)); }
.booking__panel p{ margin:12px 0 28px; color:rgb(var(--papyrus) / .82); }

/* Coptic accent + footer */
.coptic-accent{ display:flex; align-items:center; gap:12px; margin:0 0 18px; font-family:var(--font-coptic); font-size:.95rem; letter-spacing:.14em; color:rgb(var(--gold) / .85); }
.coptic-accent::before, .coptic-accent::after{ content:""; height:1px; width:36px; background:rgb(var(--gold) / .4); }
.coptic-accent::after{ display:none; }
.hb-footer{ position:relative; z-index:10; padding:0 20px calc(40px + env(safe-area-inset-bottom,0px)); }
.hb-footer__panel{ max-width:72rem; margin-inline:auto; padding:22px 28px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:18px 32px; }
.hb-footer .coptic-accent{ margin:0; justify-content:center; }
.hb-footer .coptic-accent::after{ display:block; }
.hb-footer__copy{ margin:0; font-size:.85rem; color:rgb(var(--dust)); }
/* Orioverse credit keeps the company's own brand: logo + DM Sans / Inter */
.hb-footer__credit{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; text-align:end; font-family:"Inter","Noto Naskh Arabic",system-ui,sans-serif; }
.hb-footer__credit a{ display:inline-flex; align-items:center; gap:10px; color:rgb(248 250 252 / .82); text-decoration:none; font-family:"DM Sans","Noto Naskh Arabic",system-ui,sans-serif; font-weight:500; font-size:.82rem; letter-spacing:.02em; }
.hb-footer__credit a img{ display:block; height:30px; width:auto; transition:opacity .2s; }
.hb-footer__credit a:hover{ color:rgb(248 250 252); }
.hb-footer__credit a:hover img{ opacity:.85; }
@media (max-width:640px){ .hb-footer__panel{ flex-direction:column; text-align:center; } .hb-footer__credit{ align-items:center; text-align:center; } }
@media (max-width:1179px){ main{ padding-bottom:0 !important; } .hb-footer{ padding-bottom:calc(92px + env(safe-area-inset-bottom,0px)); } }

@media (prefers-reduced-motion:reduce){ [data-i18n-fade], .hb-marker__dot, .rail .tick{ transition:none; } }
</style>

inations": [{"id": "st-catherine", "coords": [28.5559, 33.976], "airport": {"code": "SSH", "name": {"en": "Sharm El Sheikh", "ar": "شرم الشيخ", "de": "Scharm El-Scheich"}}, "media": {"photo": {"file": null, "wiki": ["Saint Catherine's Monastery"], "search": "Saint Catherine's Monastery Sinai"}}, "i18n": {"en": {"name": "Saint Catherine's Monastery", "region": "South Sinai", "summary": "Built between 548 and 565 on the orders of Emperor Justinian at the foot of Mount Sinai, it is among the oldest continuously inhabited Christian monasteries. Its library and icon collection are among the most important in the world.", "facts": ["UNESCO World Heritage, 2002", "Greek Orthodox", "6th century"]}, "ar": {"name": "دير سانت كاترين", "region": "جنوب سيناء", "summary": "شُيّد بين عامي ٥٤٨ و٥٦٥ بأمر الإمبراطور جستنيان عند سفح جبل سيناء، وهو من أقدم الأديرة المسيحية المأهولة دون انقطاع. مكتبته ومجموعة أيقوناته من الأهم في العالم.", "facts": ["تراث عالمي لليونسكو، ٢٠٠٢", "روم أرثوذكس", "القرن السادس"]}, "de": {"name": "Katharinenkloster", "region": "Südsinai", "summary": "Zwischen 548 und 565 auf Befehl Kaiser Justinians am Fuß des Berges Sinai erbaut, zählt es zu den ältesten durchgehend bewohnten christlichen Klöstern. Seine Bibliothek und seine Ikonensammlung gehören zu den bedeutendsten der Welt.", "facts": ["UNESCO-Welterbe, 2002", "Griechisch-orthodox", "6. Jahrhundert"]}}, "group": "christian"}, {"id": "st-anthony", "coords": [28.9247, 32.3494], "airport": {"code": "HRG", "name": {"en": "Hurghada", "ar": "الغردقة", "de": "Hurghada"}}, "media": {"photo": {"file": null, "wiki": ["Monastery of Saint Anthony"], "search": "Monastery of Saint Anthony Egypt"}}, "i18n": {"en": {"name": "Monastery of Saint Anthony", "region": "Red Sea mountains", "summary": "Founded in the 4th century by followers of Saint Anthony the Great, the father of monasticism. Its old church holds wall paintings from the 13th century.", "facts": ["Coptic Orthodox", "4th century"]}, "ar": {"name": "دير الأنبا أنطونيوس", "region": "جبال البحر الأحمر", "summary": "أسسه في القرن الرابع تلاميذ القديس أنطونيوس الكبير، أبي الرهبنة. تضم كنيسته القديمة جداريات من القرن الثالث عشر.", "facts": ["قبطي أرثوذكسي", "القرن الرابع"]}, "de": {"name": "Antoniuskloster", "region": "Gebirge am Roten Meer", "summary": "Im 4. Jahrhundert von Schülern des heiligen Antonius des Großen, des Vaters des Mönchtums, gegründet. Die alte Kirche birgt Wandmalereien aus dem 13. Jahrhundert.", "facts": ["Koptisch-orthodox", "4. Jahrhundert"]}}, "group": "christian"}, {"id": "st-paul", "coords": [28.8483, 32.5519], "airport": {"code": "HRG", "name": {"en": "Hurghada", "ar": "الغردقة", "de": "Hurghada"}}, "media": {"photo": {"file": null, "wiki": ["Monastery of Saint Paul the Anchorite"], "search": "Monastery of Saint Paul the Anchorite"}}, "i18n": {"en": {"name": "Monastery of Saint Paul the Anchorite", "region": "Red Sea mountains", "summary": "It stands over the cave where, by tradition, Saint Paul the first hermit lived. The monastery dates back to the 5th century.", "facts": ["Coptic Orthodox", "5th century"]}, "ar": {"name": "دير الأنبا بولا", "region": "جبال البحر الأحمر", "summary": "يقوم فوق المغارة التي عاش فيها، بحسب التقليد، القديس الأنبا بولا أول السواح. يعود الدير إلى القرن الخامس.", "facts": ["قبطي أرثوذكسي", "القرن الخامس"]}, "de": {"name": "Pauluskloster", "region": "Gebirge am Roten Meer", "summary": "Es steht über der Höhle, in der der Überlieferung nach der heilige Paulus von Theben, der erste Einsiedler, lebte. Das Kloster geht auf das 5. Jahrhundert zurück.", "facts": ["Koptisch-orthodox", "5. Jahrhundert"]}}, "group": "christian"}, {"id": "white-monastery", "coords": [26.5347, 31.6453], "airport": {"code": "HMB", "name": {"en": "Sohag", "ar": "سوهاج", "de": "Sohag"}}, "media": {"photo": {"file": null, "wiki": ["White Monastery"], "search": "White Monastery Sohag"}}, "i18n": {"en": {"name": "White Monastery", "region": "Sohag", "summary": "Near Sohag. Its great church of white limestone dates from the 5th century, the time of Saint Shenoute, who led one of the largest monastic communities in Egypt.", "facts": ["Coptic Orthodox", "5th century"]}, "ar": {"name": "الدير الأبيض (دير الأنبا شنودة)", "region": "سوهاج", "summary": "قرب سوهاج. تعود كنيسته الكبرى المبنية من الحجر الجيري الأبيض إلى القرن الخامس، زمن القديس الأنبا شنودة الذي قاد واحدة من كبرى الجماعات الرهبانية في مصر.", "facts": ["قبطي أرثوذكسي", "القرن الخامس"]}, "de": {"name": "Weißes Kloster", "region": "Sohag", "summary": "Bei Sohag. Die große Kirche aus weißem Kalkstein stammt aus dem 5. Jahrhundert, der Zeit des heiligen Schenute, der eine der größten Mönchsgemeinschaften Ägyptens leitete.", "facts": ["Koptisch-orthodox", "5. Jahrhundert"]}}, "group": "christian"}, {"id": "red-monastery", "coords": [26.5567, 31.62], "airport": {"code": "HMB", "name": {"en": "Sohag", "ar": "سوهاج", "de": "Sohag"}}, "media": {"photo": {"file": null, "wiki": ["Red Monastery"], "search": "Red Monastery Sohag"}}, "i18n": {"en": {"name": "Red Monastery", "region": "Sohag", "summary": "A few kilometres north of the White Monastery and built of red brick. Its church preserves some of the finest late antique wall paintings in Egypt, now restored.", "facts": ["Coptic Orthodox", "5th–6th century"]}, "ar": {"name": "الدير الأحمر (دير الأنبا بيشاي)", "region": "سوهاج", "summary": "على بعد كيلومترات قليلة شمال الدير الأبيض، وهو مبني من الطوب الأحمر. تحفظ كنيسته بعضًا من أروع الجداريات القبطية القديمة في مصر بعد ترميمها.", "facts": ["قبطي أرثوذكسي", "القرنان الخامس والسادس"]}, "de": {"name": "Rotes Kloster", "region": "Sohag", "summary": "Wenige Kilometer nördlich des Weißen Klosters, aus roten Ziegeln erbaut. Seine Kirche bewahrt einige der schönsten spätantiken Wandmalereien Ägyptens, die inzwischen restauriert sind.", "facts": ["Koptisch-orthodox", "5.–6. Jahrhundert"]}}, "group": "christian"}, {"id": "abu-mena", "coords": [30.841, 29.663], "airport": {"code": "HBE", "name": {"en": "Alexandria (Borg El Arab)", "ar": "الإسكندرية (برج العرب)", "de": "Alexandria (Borg El Arab)"}}, "media": {"photo": {"file": null, "wiki": ["Abu Mena"], "search": "Abu Mena Egypt"}}, "i18n": {"en": {"name": "Abu Mena", "region": "Near Alexandria", "summary": "Southwest of Alexandria lie the remains of an early Christian pilgrimage city, built over the tomb of the martyr Saint Menas. The modern Monastery of Saint Mina stands nearby.", "facts": ["UNESCO World Heritage, 1979", "4th–7th century"]}, "ar": {"name": "أبو مينا", "region": "قرب الإسكندرية", "summary": "جنوب غرب الإسكندرية تقع أطلال مدينة حج مسيحية مبكرة قامت حول قبر الشهيد مار مينا، وبجوارها دير مار مينا الحديث.", "facts": ["تراث عالمي لليونسكو، ١٩٧٩", "من القرن الرابع إلى السابع"]}, "de": {"name": "Abu Mena", "region": "Bei Alexandria", "summary": "Südwestlich von Alexandria liegen die Überreste einer frühchristlichen Pilgerstadt über dem Grab des Märtyrers Menas. In der Nähe steht das moderne Menaskloster.", "facts": ["UNESCO-Welterbe, 1979", "4.–7. Jahrhundert"]}}, "group": "christian"}, {"id": "st-simon", "coords": [30.0306, 31.2767], "airport": {"code": "CAI", "name": {"en": "Cairo", "ar": "القاهرة", "de": "Kairo"}}, "media": {"photo": {"file": null, "wiki": ["Monastery of Saint Simon", "Monastery of Saint Simon the Tanner"], "search": "Saint Simon the Tanner cave church Mokattam"}}, "i18n": {"en": {"name": "Cave Church of Saint Simon the Tanner", "region": "Mokattam, Cairo", "summary": "Carved into the Mokattam hills in Cairo from the 1970s onwards. Its main hall seats about 20,000 people and is one of the largest churches in the Middle East.", "facts": ["Coptic Orthodox", "20th century"]}, "ar": {"name": "كنيسة المغارة بدير القديس سمعان الخراز", "region": "المقطم، القاهرة", "summary": "منحوتة في جبل المقطم بالقاهرة منذ سبعينيات القرن العشرين. يتسع مدرجها الرئيسي لنحو ٢٠ ألف شخص، وهي من أكبر الكنائس في الشرق الأوسط.", "facts": ["قبطي أرثوذكسي", "القرن العشرون"]}, "de": {"name": "Höhlenkirche des heiligen Simon des Gerbers", "region": "Mokattam, Kairo", "summary": "Seit den 1970er-Jahren in die Mokattam-Felsen in Kairo gehauen. Der Hauptraum fasst rund 20.000 Menschen und gehört zu den größten Kirchen im Nahen Osten.", "facts": ["Koptisch-orthodox", "20. Jahrhundert"]}}, "group": "christian"}, {"id": "st-mark-alexandria", "coords": [31.1985, 29.8994], "airport": {"code": "HBE", "name": {"en": "Alexandria (Borg El Arab)", "ar": "الإسكندرية (برج العرب)", "de": "Alexandria (Borg El Arab)"}}, "media": {"photo": {"file": null, "wiki": ["Saint Mark's Coptic Orthodox Cathedral (Alexandria)"], "search": "Saint Mark Coptic Cathedral Alexandria"}}, "i18n": {"en": {"name": "Saint Mark's Cathedral, Alexandria", "region": "Alexandria", "summary": "The historic seat of the Coptic Pope of Alexandria. By tradition it stands where Saint Mark the Evangelist founded the church in Egypt in the first century. The present building dates from the 19th and 20th centuries.", "facts": ["Coptic Orthodox", "Founded in the 1st century by tradition"]}, "ar": {"name": "الكاتدرائية المرقسية بالإسكندرية", "region": "الإسكندرية", "summary": "المقر التاريخي لبابا الإسكندرية للأقباط الأرثوذكس. بحسب التقليد تقوم في الموضع الذي أسس فيه القديس مرقس الرسول الكنيسة في مصر في القرن الأول. يعود المبنى الحالي إلى القرنين التاسع عشر والعشرين.", "facts": ["قبطي أرثوذكسي", "تأسست في القرن الأول بحسب التقليد"]}, "de": {"name": "Markuskathedrale, Alexandria", "region": "Alexandria", "summary": "Historischer Sitz des koptischen Papstes von Alexandria. Der Überlieferung nach steht sie dort, wo der Evangelist Markus im 1. Jahrhundert die Kirche in Ägypten gründete. Der heutige Bau stammt aus dem 19. und 20. Jahrhundert.", "facts": ["Koptisch-orthodox", "Der Überlieferung nach im 1. Jahrhundert gegründet"]}}, "group": "christian"}, {"id": "al-azhar", "group": "islamic", "coords": [30.0457, 31.2627], "airport": {"code": "CAI", "name": {"en": "Cairo", "ar": "القاهرة", "de": "Kairo"}}, "media": {"photo": {"file": null, "wiki": ["Al-Azhar Mosque function demAt(r,c){ r=r<0?0:r>=DEM.rows?DEM.rows-1:r; c=c<0?0:c>=DEM.cols?DEM.cols-1:c; const v=demGrid[r*DEM.cols+c]; return v>0?v:0; }
const cr=(p0,p1,p2,p3,t)=>p1+0.5*t*(p2-p0+t*(2*p0-5*p1+4*p2-p3+t*(3*(p1-p2)+p3-p0)));
function elev(lat,lng){
  const fr=(DEM.latN-lat)/DEM.step, fc=(lng-DEM.lngW)/DEM.step, r=Math.floor(fr), c=Math.floor(fc), tr=fr-r, tc=fc-c;
  const row=k=>cr(demAt(r+k,c-1),demAt(r+k,c),demAt(r+k,c+1),demAt(r+k,c+2),tc);
  return Math.max(0,cr(row(-1),row(0),row(1),row(2),tr));
}
const heightXZ=(x,z)=>elev(LAT0-z/KY, x/KX+LNG0)/M_PER_UNIT*EXAG;

function drawTexture(size){
  const W=size, H=Math.min(size, Math.round(size*(EXT.z1-EXT.z0)/(EXT.x1-EXT.x0)));
  const sx=W/(EXT.x1-EXT.x0), sz=H/(EXT.z1-EXT.z0), px=4096/size;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d");
  g.setTransform(sx,0,0,sz,-EXT.x0*sx,-EXT.z0*sz);
  const fill=(d,c)=>{ g.fillStyle=c; g.fill(new Path2D(d)); };
  const line=(d,c,w,dash)=>{ g.strokeStyle=c; g.lineWidth=w/sx/px; g.setLineDash(dash?dash.map(v=>v/sx/px):[]); g.lineJoin="round"; g.lineCap="round"; g.stroke(new Path2D(d)); };
  g.fillStyle="#0e0e12"; g.fillRect(EXT.x0,EXT.z0,EXT.x1-EXT.x0,EXT.z1-EXT.z0);
  for(let lng=24;lng<=37;lng++){ const x=(lng-LNG0)*KX; line(`M${x},${EXT.z0}L${x},${EXT.z1}`,"rgba(201,164,92,0.05)",1.2); }
  for(let lat=21;lat<=33;lat++){ const z=(LAT0-lat)*KY; line(`M${EXT.x0},${z}L${EXT.x1},${z}`,"rgba(201,164,92,0.05)",1.2); }
  fill(GEO.neighbors,"#1c1a19");
  fill(GEO.egypt,"#35302a");
  line(GEO.nile,"rgba(201,164,92,0.10)",70);
  line(GEO.nile,"rgba(201,164,92,0.18)",26);
  line(GEO.roads,"rgba(238,229,209,0.08)",2.2);
  line(GEO.admin,"rgba(201,164,92,0.13)",2,[7,9]);
  fill(GEO.lakes,"#0e0e12"); line(GEO.lakes,"rgba(201,164,92,0.4)",2.4);
  return cv;
}

function parsePath(d){
  const out=[]; let cur=null;
  d.replace(/([MLZ])([^MLZ]*)/g,(m,cmd,args)=>{
    if(cmd==="M"){ cur=[]; out.push(cur); }
    if(cmd==="Z"){ if(cur&&cur.length) cur.push(cur[0]); return m; }
    const n=args.split(/[ ,]+/).filter(Boolean).map(Number);
    for(let i=0;i+1<n.length;i+=2) cur.push([n[i],n[i+1]]);
    return m;
  });
  return out;
}
function drape(polys,lift,step){
  const pos=[];
  polys.forEach(poly=>{
    for(let i=0;i<poly.length-1;i++){
      const [x1,z1]=poly[i],[x2,z2]=poly[i+1], n=step?Math.max(1,Math.ceil(Math.hypot(x2-x1,z2-z1)/step)):1;
      for(let k=0;k<n;k++){
        const a=k/n,b=(k+1)/n, xa=x1+(x2-x1)*a, za=z1+(z2-z1)*a, xb=x1+(x2-x1)*b, zb=z1+(z2-z1)*b;
        pos.push(xa,heightXZ(xa,za)+lift,za, xb,heightXZ(xb,zb)+lift,zb);
      }
    }
  });
  const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3)); return geo;
}

function buildTerrain(tex){
  const NX=320, NZ=Math.round(NX*(EXT.z1-EXT.z0)/(EXT.x1-EXT.x0));
  const pos=new Float32Array((NX+1)*(NZ+1)*3), uv=new Float32Array((NX+1)*(NZ+1)*2); let k=0,u=0;
  for(let j=0;j<=NZ;j++){ const z=EXT.z0+(EXT.z1-EXT.z0)*j/NZ;
    for(let i=0;i<=NX;i++){ const x=EXT.x0+(EXT.x1-EXT.x0)*i/NX; pos[k++]=x; pos[k++]=heightXZ(x,z); pos[k++]=z; uv[u++]=i/NX; uv[u++]=1-j/NZ; } }
  const idx=new Uint32Array(NX*NZ*6); let q=0;
  for(let j=0;j<NZ;j++) for(let i=0;i<NX;i++){ const a=j*(NX+1)+i,b=a+1,c=a+NX+1,d=c+1; idx[q++]=a;idx[q++]=c;idx[q++]=b;idx[q++]=b;idx[q++]=c;idx[q++]=d; }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3)); geo.setAttribute("uv",new THREE.BufferAttribute(uv,2));
  geo.setIndex(new THREE.BufferAttribute(idx,1)); geo.computeVertexNormals();
  return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,roughness:1,metalness:0}));
}

function init3D(){
  if(typeof THREE==="undefined") throw new Error("three.js not loaded");
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(innerWidth,innerHeight,false);
  renderer.outputEncoding=THREE.sRGBEncoding;
  maxTex=Math.min(4096,renderer.capabilities.maxTextureSize||4096);
  scene=new THREE.Scene();
  const ink=new THREE.Color("#0d0d10"); scene.background=ink; scene.fog=new THREE.Fog(ink,100,400);
  camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.5,5000);

  const tex=new THREE.CanvasTexture(drawTexture(maxTex));
  tex.encoding=THREE.sRGBEncoding; tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  scene.add(buildTerrain(tex));

  scene.add(new THREE.HemisphereLight(0xfff3e0,0x141216,0.85));
  const sun=new THREE.DirectionalLight(0xffe6c0,1.25); sun.position.set(-0.8,1.1,-0.7); scene.add(sun);

  const gold=new THREE.Color("#c9a45c"), soft=new THREE.Color("#e4cf9c");
  const coast=new THREE.LineSegments(drape(parsePath(GEO.egypt),0.06,0),new THREE.LineBasicMaterial({color:gold,transparent:true,opacity:0.45,fog:true}));
  const nile=new THREE.LineSegments(drape(parsePath(GEO.nile),0.08,0),new THREE.LineBasicMaterial({color:gold,transparent:true,opacity:0.9}));
  const canals=new THREE.LineSegments(drape(parsePath(GEO.canals),0.08,0),new THREE.LineBasicMaterial({color:gold,transparent:true,opacity:0.5}));
  const bordersGeo=drape(parsePath(GEO.borders),0.1,2);
  const borders=new THREE.LineSegments(bordersGeo,new THREE.LineDashedMaterial({color:gold,dashSize:1.4,gapSize:2.2,transparent:true,opacity:0.5}));
  borders.computeLineDistances();
  const routePts=[DATA.stops.map(s=>P(s.coords))];
  const route=new THREE.LineSegments(drape(routePts,0.35,0.6),new THREE.LineDashedMaterial({color:soft,dashSize:0.5,gapSize:0.55}));
  route.computeLineDistances();
  [coast,nile,canals,borders,route].forEach(o=>scene.add(o));

  const stemMat=new THREE.LineBasicMaterial({color:soft,transparent:true,opacity:0.8});
  DATA.stops.forEach(s=>{
    const [x,z]=P(s.coords), h=heightXZ(x,z);
    const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.Float32BufferAttribute([0,0,0,0,1,0],3));
    const stem=new THREE.Line(g,stemMat); stem.position.set(x,h,z); scene.add(stem); stems.set(s.id,stem);
  });
  has3D=true;
}

/* camera state: target (tx,tz), view width w (world units), pitch/bearing (deg), screen framing fx/fy.
   Framing mirrors with dir so the spot clears the drawer; orbit is a small scroll-driven bearing offset. */
const cam={tx:0,tz:0,w:560,pitch:38,bearing:-6,orbit:0,fx:.5,fy:.5};
function camFor(id){
  const vw=innerWidth, wide=vw>=900, rtl=loc().dir==="rtl";
  const s=id && DATA.stops.find(x=>x.id===id);
  if(s){
    const [x,z]=P(s.coords);
    let w=Math.max(78,900/Math.pow(2,(s.camera.zoom-7)*0.55)); if(!wide) w*=0.9;
    return {tx:x,tz:z,w,pitch:Math.min(58,s.camera.pitch),bearing:s.camera.bearing,fx:wide?(rtl?0.64:0.36):0.5,fy:wide?0.64:0.3};
  }
  const [x,z]=P([28.75,30.95]);
  return {tx:x,tz:z,w:wide?640:620,pitch:40,bearing:-8,fx:wide?(rtl?0.27:0.73):0.5,fy:wide?0.5:0.55};
}
const DEG=Math.PI/180;
function updateCamera(){
  const W=innerWidth,H=innerHeight,aspect=W/H, ty=heightXZ(cam.tx,cam.tz);
  const D=cam.w/(2*Math.tan(camera.fov/2*DEG)*aspect);
  const p=cam.pitch*DEG, b=(cam.bearing+cam.orbit)*DEG, hd=D*Math.sin(p);
  camera.aspect=aspect;
  camera.position.set(cam.tx-hd*Math.sin(b), ty+D*Math.cos(p), cam.tz+hd*Math.cos(b));
  camera.up.set(0,1,0); camera.lookAt(cam.tx,ty,cam.tz);
  camera.near=Math.max(0.5,D*0.05); camera.far=D*8;
  camera.setViewOffset(W,H,(0.5-cam.fx)*W,(0.5-cam.fy)*H,W,H);
  camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  scene.fog.near=D*0.9; scene.fog.far=D*3.4;
  const stemH=cam.w*0.035; stems.forEach(st=>{ st.scale.y=stemH; });
  return stemH;
}
const _v=new (window.THREE?THREE.Vector3:Object)();
function project(x,y,z){ _v.set(x,y,z).project(camera); if(_v.z>1||_v.z<-1) return null; return [(_v.x+1)/2*innerWidth,(1-_v.y)/2*innerHeight]; }
function frame(){
  requestAnimationFrame(frame);
  if(!dirty) return; dirty=false;
  const stemH=updateCamera();
  const t0=performance.now();
  renderer.render(scene,camera);
  // adaptive quality: if frames are slow, lower the render resolution (not the map data)
  const dt=performance.now()-t0; slowFrames = dt>45 ? slowFrames+1 : 0;
  if(slowFrames>4 && renderer.getPixelRatio()>0.75){ renderer.setPixelRatio(Math.max(0.75,renderer.getPixelRatio()-0.5)); renderer.setSize(innerWidth,innerHeight,false); slowFrames=0; }
  placePins(stemH);
}
const markDirty=()=>{ dirty=true; };
function placePins(stemH){
  const vw=innerWidth, vh=innerHeight, shown=[];
  const place=(pin,xy)=>{ pin.style.transform=`translate(${xy[0].toFixed(1)}px,${xy[1].toFixed(1)}px)`; };
  markerEls.forEach((v,id)=>{
    const xy=project(v.x,v.h+stemH,v.z);
    const covered=!xy || (id!==activeId && shown.some(s=>Math.hypot(s[0]-xy[0],s[1]-xy[1])<24));
    v.pin.classList.toggle("is-hidden",covered);
    if(xy){ if(!covered) shown.push(xy); place(v.pin,xy); }
  });
  labelEls.forEach(v=>{
    const xy=project(...v.w), m=v.m, rank=m.rank||1;
    let show=!!xy && xy[0]>-200 && xy[0]<vw+200 && xy[1]>-50 && xy[1]<vh+50;
    if(m.kind==="region") show=show && cam.w>240;
    if(m.kind==="city" && rank===2) show=show && cam.w<330;
    if(m.kind==="sea" && rank===2) show=show && cam.w<520;
    if(m.kind==="airport") show=show && cam.w<330 && !shown.some(s=>Math.hypot(s[0]-xy[0],s[1]-xy[1])<34);
    if(show && m.kind==="city") show=!shown.some(s=>Math.hypot(s[0]-xy[0],s[1]-xy[1])<56);
    v.pin.classList.toggle("is-hidden",!show);
    if(show) place(v.pin,xy);
  });
  partnerEls.forEach(v=>{
    const xy=v.p.stopId===activeId && cam.w<200 ? project(...v.w) : null;
    v.pin.classList.toggle("is-hidden",!xy);
    if(xy) place(v.pin,xy);
  });
  const act=activeId&&markerEls.get(activeId);
  if(act){ const xy=project(act.x,act.h+stemH,act.z); if(xy) place(cardPin,xy); }
}
let activeId=undefined;
function moveCamera(immediate){
  if(!has3D) return;
  const target=camFor(activeId);
  if(immediate||reduce||!hasGSAP){ Object.assign(cam,target); markDirty(); return; }
  gsap.to(cam,Object.assign({},target,{duration:2.4,ease:"power2.inOut",overwrite:"auto",onUpdate:markDirty}));
}
const orbitTo = (typeof gsap!=="undefined") ? gsap.quickTo(cam,"orbit",{duration:0.9,ease:"power2.out",onUpdate:markDirty}) : (v=>{cam.orbit=v;markDirty();});
function setActive(id){
  if(id===activeId) return; activeId=id;
  markerEls.forEach((v,k)=>v.el.classList.toggle("is-active",k===id));
  railItems.forEach((li,k)=>{ li.classList.toggle("is-active",k===id); const b=li.querySelector("button"); if(k===id) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current"); });
  card.classList.remove("is-open");
  renderCard();
  if(id) setTimeout(()=>{ if(activeId===id) card.classList.add("is-open"); }, reduce?0:1100);
  moveCamera(false);
}

/* ---------- site photos: freely licensed images from Wikimedia Commons ----------
   Sources per stop are in DATA.stops[].media.photo (see meta.notes). Author and licence are read live from
   Commons, only free licences are shown, and every photo carries its credit. Any failure keeps the illustration. */
const WP_API="https://en.wikipedia.org/w/api.php", CM_API="https://commons.wikimedia.org/w/api.php";
const FREE_LICENCE=/^(cc0|cc[ -]by|public domain|pd\b|gfdl|attribution|copyrighted free use)/i;
const sitePhotos={};
const plainText=h=>{ try{ return (new DOMParser().parseFromString(String(h),"text/html").body.textContent||"").replace(/\s+/g," ").trim(); }catch(e){ return ""; } };
const wikiApi=(base,params)=>fetch(base+"?"+new URLSearchParams(Object.assign({action:"query",format:"json",origin:"*"},params))).then(r=>r.ok?r.json():Promise.reject(r.status));
const II={prop:"imageinfo",iiprop:"url|size|mime|extmetadata",iiurlwidth:960,iiextmetadatafilter:"Artist|LicenseShortName|LicenseUrl"};
function photoFrom(page){
  const ii=page&&page.imageinfo&&page.imageinfo[0]; if(!ii||!ii.thumburl||!/^https:\/\/upload\.wikimedia\.org\//.test(ii.thumburl)) return null;
  const m=ii.extmetadata||{}, lic=plainText((m.LicenseShortName&&m.LicenseShortName.value)||"");
  if(!FREE_LICENCE.test(lic) || !/^image\/(jpeg|png|webp)$/.test(ii.mime||"")) return null;
  const url=x=>/^https?:\/\//.test(x||"")?x:"";
  return { src:ii.thumburl, ow:ii.width||0, oh:ii.height||0, mime:ii.mime, license:lic, licenseUrl:url(m.LicenseUrl&&m.LicenseUrl.value),
    author:plainText((m.Artist&&m.Artist.value)||"").slice(0,70), page:url(ii.descriptionurl) };
}
function creditHTML(p){
  if(p.local) return "";
  const who=p.author||t("ui.media.photoSource"), a=(href,txt)=>href?`<a href="${esc(href)}" target="_blank" rel="noopener"><bdi>${esc(txt)}</bdi></a>`:`<bdi>${esc(txt)}</bdi>`;
  return `${esc(t("ui.media.photo"))}: ${a(p.page,who)} · ${a(p.licenseUrl,p.license)}${p.author?" · "+esc(t("ui.media.photoSource")):""}`;
}
function applyPhotos(){
  document.querySelectorAll("[data-photo]").forEach(fig=>{
    const p=sitePhotos[fig.dataset.photo]; fig.hidden=!p; if(!p){ fig.innerHTML=""; return; }
    const s=DATA.stops.find(x=>x.id===fig.dataset.photo), dd=!s&&(DATA.destinations||[]).find(x=>x.id===fig.dataset.photo);
    const alt=s?(s.media.alt[lang]||s.media.alt.en):dd?((dd.i18n[lang]||dd.i18n.en).name):"";
    const cr=creditHTML(p);
    fig.innerHTML=`<div class="stop-photo__frame"><img alt="${esc(alt)}" src="${esc(p.src)}" loading="lazy" decoding="async"${p.position?` style="object-position:${esc(p.position)}"`:""}></div>${cr?`<figcaption class="credit" data-i18n-fade>${cr}</figcaption>`:""}`;
    const img=fig.querySelector("img"); if(img.complete&&img.naturalWidth) img.classList.add("is-loaded"); else img.onload=()=>img.classList.add("is-loaded");
    img.onerror=()=>{ delete sitePhotos[fig.dataset.photo]; applyPhotos(); renderCard(); };
  });
}
async function loadSitePhotos(){
  const all=DATA.stops.concat(DATA.destinations||[]).filter(s=>s.media&&s.media.photo);
  all.forEach(s=>{ const ph=s.media.photo; if(ph.src) sitePhotos[s.id]={src:ph.src,position:ph.position||"",local:true}; });   /* own photos: no network needed */
  if(Object.keys(sitePhotos).length){ applyPhotos(); renderCard(); }
  const want=all.filter(s=>!s.media.photo.src); if(!want.length || !window.fetch) return;
  const lead={};
  const titles=[...new Set(want.flatMap(s=>s.media.photo.file?[]:(s.media.photo.wiki||[])))];
  if(titles.length){ try{
    const q=(await wikiApi(WP_API,{redirects:1,prop:"pageimages",piprop:"name",pilicense:"free",pilimit:50,titles:titles.join("|")})).query||{};
    const alias={}; (q.normalized||[]).concat(q.redirects||[]).forEach(x=>{ alias[x.from]=x.to; });
    const byTitle={}; Object.values(q.pages||{}).forEach(pg=>{ if(pg.pageimage) byTitle[pg.title]=pg.pageimage; });
    titles.forEach(tt=>{ let k=tt; for(let i=0;i<4&&alias[k];i++) k=alias[k]; if(byTitle[k]) lead[tt]=byTitle[k]; });
  }catch(e){} }
  const fileFor=s=>s.media.photo.file || (s.media.photo.wiki||[]).map(tt=>lead[tt]).find(Boolean);
  const files=[...new Set(want.map(fileFor).filter(Boolean))];
  if(files.length){ try{
    const q=(await wikiApi(CM_API,Object.assign({titles:files.map(f=>"File:"+f).join("|")},II))).query||{};
    const norm={}; (q.normalized||[]).forEach(x=>{ norm[x.from]=x.to; });
    const pages={}; Object.values(q.pages||{}).forEach(pg=>{ pages[pg.title]=pg; });
    want.forEach(s=>{ const f=fileFor(s); if(!f) return; const k="File:"+f, ph=photoFrom(pages[norm[k]||k]); if(ph) sitePhotos[s.id]=ph; });
  }catch(e){} }
  await Promise.all(want.filter(s=>!sitePhotos[s.id]&&s.media.photo.search).map(async s=>{ try{
    const q=(await wikiApi(CM_API,Object.assign({generator:"search",gsrnamespace:6,gsrlimit:12,gsrsearch:s.media.photo.search+" filetype:bitmap"},II))).query||{};
    const hit=Object.values(q.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0)).map(photoFrom).find(ph=>ph&&ph.mime==="image/jpeg"&&ph.ow>=1000&&ph.ow>ph.oh);
    if(hit) sitePhotos[s.id]=hit;
  }catch(e){} }));
  if(Object.keys(sitePhotos).length){ applyPhotos(); renderCard(); }
}

let photos={}, assetsApi=null, dbApi=null, busy=false;
function renderCard(){

  const frame=document.getElementById("card-frame"), asset=photos[s.id], site=!asset&&sitePhotos[s.id];

      const img=frame.firstElementChild; img.onload=()=>img.classList.add("is-loaded");

function setStatus(msg){ document.getElementById("card-status").textContent=msg||""; }
async function uploadPhoto(file){
  if(!assetsApi||!dbApi||!activeId||busy) return;
  const id=activeId, old=photos[id]; busy=true; setStatus(t("ui.media.uploading"));
  try{
    const res=await assetsApi.upload(file, /^image\/(jpeg|png|webp)$/.test(file.type)?{type:file.type}:undefined);
    await dbApi.doc("photos/"+id).set({asset:res.id, updatedAt:Date.now()});
    if(old && old!==res.id) assetsApi.delete(old).catch(()=>{});
    setStatus("");
  }catch(e){ console.warn("upload",e&&e.code); setStatus(t("ui.media.uploadFailed")); }
  busy=false;
}
async function removePhoto(){
  if(!assetsApi||!dbApi||!activeId||busy) return;
  const id=activeId, old=photos[id]; if(!old) return; busy=true;
  try{ await dbApi.doc("photos/"+id).delete(); await assetsApi.delete(old); }catch(e){ console.warn("remove",e&&e.code); }
  busy=false;
}
async function initCapabilities(){
  if(!window.claude || typeof window.claude.use!=="function") return;
  try{ dbApi=await window.claude.use("db"); }catch(e){ dbApi=null; }
  if(dbApi){
    dbApi.collection("photos").onSnapshot(snap=>{
      const next={};
      snap.docs.forEach(doc=>{ const v=doc.data(); if(v && typeof v.asset==="string" && /^[0-9a-f]{32}$/.test(v.asset)) next[doc.id]=v.asset; });
      photos=next; renderCard();
    },()=>{});

  try{ assetsApi=await window.claude.use("assets"); }catch(e){ assetsApi=null; }
  try{ sampleApi=await window.claude.use("sample"); }catch(e){ sampleApi=null; }
  renderCard();
}

/* ---------- scroll anchoring (same algorithm as LanguageContext) ---------- */
function measureBox(el){ const box=el.parentElement&&el.parentElement.classList.contains("pin-spacer")?el.parentElement:el; return box.getBoundingClientRect(); }
function captureAnchor(){
  let a=null;
  document.querySelectorAll("[data-scroll-anchor]").forEach(el=>{ const r=measureBox(el); if(r.top<=1&&r.bottom>0&&r.height>0) a={id:el.dataset.scrollAnchor,progress:-r.top/r.height}; });
  return a||{id:null,y:scrollY};
}
function restoreAnchor(a){
  if(!a) return;
  if(!a.id){ scrollTo({top:a.y,behavior:"instant"}); return; }
  const el=document.querySelector(`[data-scroll-anchor="${CSS.escape(a.id)}"]`); if(!el) return;
  const r=measureBox(el); scrollTo({top:scrollY+r.top+a.progress*r.height,behavior:"instant"});
}
function resync(anchor){
  if(hasGSAP) ScrollTrigger.refresh();
  restoreAnchor(anchor);
  if(hasGSAP) ScrollTrigger.update();
}

let switching=false;
function setLang(next){
  if(next===lang||!SUPPORTED.includes(next)||switching) return;
  switching=true;
  const commit=()=>{
    const anchor=captureAnchor();
    lang=next; applyLanguage();
    resync(anchor);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>resync(anchor));
    moveCamera(false); // padding side flips with dir
    document.getElementById("announcer").textContent=t("ui.a11y.languageSwitched");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ delete html.dataset.langSwitching; switching=false; }));
  };
  if(reduce){ commit(); return; }
  html.dataset.langSwitching="true";
  setTimeout(commit,FADE_MS);
}

function scrollToId(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}); }
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  const id=a.getAttribute("href").slice(1); if(!document.getElementById(id)) return;
  e.preventDefault(); scrollToId(id);
});

/* ---------- scroll triggers: created once, never rebuilt on language change ---------- */
const getDirSign=()=>html.dir==="rtl"?-1:1;
function initScroll(){
  if(!hasGSAP){ setActive(null); return; }
  gsap.registerPlugin(ScrollTrigger);
  ScrollTrigger.create({trigger:"#overview",start:"top top",end:"bottom center",onToggle:self=>self.isActive&&setActive(null)});
  document.querySelectorAll("[data-stop]").forEach(section=>{
    ScrollTrigger.create({trigger:section,start:"top center",end:"bottom center",onToggle:self=>self.isActive&&setActive(section.dataset.stop)});
    if(!reduce) ScrollTrigger.create({trigger:section,start:"top bottom",end:"bottom top",onUpdate:self=>{ if(section.dataset.stop===activeId) orbitTo((self.progress-0.5)*18); }});
    if(reduce) return;
    /* The card must never start outside the viewport: an off-screen start widens the page,
       which on phones stretches every fixed element (header, tab bar, sheets) and, in RTL, shifts them.
       Phones: rise from below. Wider screens: slide sideways, but only as far as the section's own gutter. */
    const narrow=()=>window.matchMedia("(max-width:767px)").matches;
    const gutter=()=>Math.min(56,parseFloat(getComputedStyle(section).paddingInlineEnd)||0);
    gsap.fromTo(section.querySelector("[data-drawer]"),
      {x:()=>narrow()?0:gutter()*getDirSign(),y:()=>narrow()?36:0,autoAlpha:0},
      {x:0,y:0,autoAlpha:1,ease:"none",scrollTrigger:{trigger:section,start:"top 80%",end:"top 35%",scrub:0.6,invalidateOnRefresh:true}});
  });
  ScrollTrigger.create({trigger:"#booking",start:"top center",end:"bottom bottom",onToggle:self=>self.isActive&&setActive(null)});
}
